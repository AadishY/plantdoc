name: 🐛 Bug Report
description: Report a reproducible bug, UI glitch, or error in PlantDoc AI
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with PlantDoc AI! Please provide clear, detailed information so we can investigate and fix it quickly.
  - type: input
    id: summary
    attributes:
      label: Brief Summary
      description: A short, descriptive sentence outlining the issue.
      placeholder: "e.g., Lesion bounding boxes shift incorrectly when zooming in fullscreen lightbox"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component / Module
      description: Which area of the application is affected?
      options:
        - "Hero Stage (Cursor Foliage Reveal)"
        - "Foliar Photo Upload & Canvas Compression"
        - "Spatial Lesion Segmentation Viewer / Lightbox"
        - "Clinical Treatment Protocol & Matrix"
        - "Vital Telemetry & Diagnosis Charts"
        - "Gemma Climate Recommendation Engine"
        - "5-Option Seasonal Engine"
        - "Wikimedia REST API Client"
        - "Mobile Dock Navigation / Viewport Layout"
        - "Build & Bundling (Vite / Rollup)"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Clear steps to trigger the bug.
      placeholder: |
        1. Go to '/diagnose'
        2. Upload a 4K resolution image of a tomato leaf
        3. Wait for diagnosis to complete
        4. Click on 'NDVI Mode'
        5. Observe unexpected rendering behavior...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "e.g., The NDVI overlay should smoothly render over the foliage canvas without clipping."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually occurred instead?
      placeholder: "e.g., A blank black box is shown and console throws a canvas context error."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Details
      description: Browser version, OS, device (e.g. Chrome 128 on Windows 11, iOS Safari 18).
      placeholder: "e.g., Chrome 128.0 (64-bit), Windows 11 Desktop"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console Logs / Error Messages
      description: Paste any browser console error traces or network responses here.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have verified this bug against the latest version of the `main` branch.
          required: true
        - label: I have checked existing issues to ensure this is not a duplicate.
          required: true
        - label: I have not included any sensitive private API keys in this issue.
          required: true
